name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Copy 404.html for client-side routing
        run: |
          cp dist/index.html dist/404.html
          echo "Created 404.html for GitHub Pages routing"
      
      - name: Verify build output
        run: |
          ls -la dist/
          if [ -f dist/index.html ]; then
            echo "✓ index.html exists"
            echo "Checking index.html content:"
            head -20 dist/index.html
          else
            echo "✗ index.html missing!"
            exit 1
          fi
          if [ -f dist/404.html ]; then
            echo "✓ 404.html exists"
          else
            echo "✗ 404.html missing!"
            exit 1
          fi
          if [ -d dist/assets ]; then
            echo "✓ assets directory exists"
            ls -la dist/assets/ | head -10
          else
            echo "✗ assets directory missing!"
            exit 1
          fi
          echo "Build verification complete"
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Verify dist contents before upload
        run: |
          echo "=== Contents of dist/ ==="
          find dist -type f | head -20
          echo ""
          echo "=== index.html content (first 15 lines) ==="
          head -15 dist/index.html
          echo ""
          echo "=== Checking for /src/main.jsx reference ==="
          if grep -q "/src/main.jsx" dist/index.html; then
            echo "ERROR: dist/index.html still contains /src/main.jsx!"
            exit 1
          else
            echo "✓ dist/index.html is correctly built"
          fi
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

